<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FnF Radar - Real-time Wallet Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a2e;
            --border: #2a2a3e;
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .search-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .input-group { display: flex; gap: 8px; }
        .input-group input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 12px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .token-banner { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; display: none; }
        .token-banner h3 { font-size: 16px; margin-bottom: 4px; }
        .token-banner p { font-size: 12px; color: var(--text-muted); }
        .token-banner .meta { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
        .token-banner .meta span { font-size: 11px; color: var(--text-dim); background: var(--card); padding: 4px 8px; border-radius: 6px; }
        .wallet-list { display: flex; flex-direction: column; gap: 10px; }
        .wallet-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
        .wallet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .wallet-name { font-weight: 600; font-size: 14px; }
        .wallet-address { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        .wallet-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-buyer { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-contract { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .wallet-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .detail-item { background: var(--card); border-radius: 10px; padding: 10px; }
        .detail-label { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
        .detail-value { font-size: 13px; font-weight: 600; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); border-radius: 12px; padding: 12px; color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none; }
        .progress { font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">⚡ FnF Radar</h1>
            <p class="tagline">Robin Hood Chain • Mainnet Scanner</p>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="contractInput" placeholder="Enter token contract address..." />
                <button class="btn" id="scanBtn" onclick="scanContract()">Scan</button>
            </div>
        </div>
        
        <div id="errorBar" class="error-msg"></div>
        <div id="progress" class="progress" style="display:none;"></div>
        
        <div id="tokenBanner" class="token-banner">
            <h3 id="tokenName"></h3>
            <p id="tokenDetails"></p>
            <div id="tokenMeta" class="meta"></div>
        </div>
        
        <div class="stats" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="totalWallets">0</div>
                <div class="stat-label">Swappers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="realBuyers">0</div>
                <div class="stat-label">Real EOAs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="contractsFiltered">0</div>
                <div class="stat-label">Contracts</div>
            </div>
        </div>
        
        <div class="wallet-list" id="walletList">
            <div class="empty-state">
                <p>Enter any token contract address on Robin Hood Chain mainnet</p>
            </div>
        </div>
    </div>
    
    <script>
        const RPC_URL = 'https://rpc.mainnet.chain.robinhood.com';
        const DEXSCREENER_API = 'https://api.dexscreener.com';
        
        // v3 pair events
        const V3_SWAP_TOPIC = '0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67';
        
        // v4 PoolManager
        const V4_POOL_MANAGER = '0x8366a39cc670b4001a1121b8f6a443a643e40951';
        const V4_SWAP_TOPIC = '0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f';
        
        async function rpcCall(method, params) {
            const resp = await fetch(RPC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', method, params, id: 1 })
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error.message || 'RPC error');
            return data.result;
        }
        
        function showProgress(msg) {
            document.getElementById('progress').style.display = 'block';
            document.getElementById('progress').textContent = msg;
        }
        
        async function scanContract() {
            const address = document.getElementById('contractInput').value.trim();
            if (!address) { showError('Please enter a contract address'); return; }
            if (!/^0x[a-fA-F0-9]{40}$/i.test(address)) { showError('Invalid Ethereum address'); return; }
            
            hideError();
            setLoading(true);
            
            try {
                const addr = address.toLowerCase();
                
                // Step 1: Get pairs from DexScreener
                showProgress('Finding trading pairs...');
                const dexResp = await fetch(`${DEXSCREENER_API}/latest/dex/tokens/${addr}`);
                const dexData = await dexResp.json();
                
                if (!dexData.pairs || dexData.pairs.length === 0) {
                    showError('No trading pairs found for this token');
                    return;
                }
                
                // Find best pair (prefer v3, fallback to v4)
                const v3Pair = dexData.pairs.find(p => p.labels && p.labels.includes('v3'));
                const v4Pair = dexData.pairs.find(p => p.labels && p.labels.includes('v4'));
                const bestPair = v3Pair || v4Pair || dexData.pairs[0];
                const pairAddress = bestPair.pairAddress;
                const isV3 = bestPair.labels && bestPair.labels.includes('v3');
                const isV4 = bestPair.labels && bestPair.labels.includes('v4');
                
                // Show token info
                const tokenInfo = bestPair.baseToken;
                document.getElementById('tokenBanner').style.display = 'block';
                document.getElementById('tokenName').textContent = `${tokenInfo.name} (${tokenInfo.symbol})`;
                document.getElementById('tokenDetails').textContent = `Pair: ${pairAddress.slice(0,10)}... • DEX: ${bestPair.dexId} ${bestPair.labels ? bestPair.labels.join(' ') : ''}`;
                document.getElementById('tokenMeta').innerHTML = `
                    <span>💰 $${bestPair.priceUsd}</span>
                    <span>📊 MC: $${(bestPair.marketCap || bestPair.fdv || 0).toLocaleString()}</span>
                    <span>💧 Liq: $${(bestPair.liquidity?.usd || 0).toLocaleString()}</span>
                    <span>📈 24h: ${bestPair.txns?.h24?.buys || 0} buys / ${bestPair.txns?.h24?.sells || 0} sells</span>
                `;
                
                let swapLogs = [];
                let scanType = '';
                
                if (isV3) {
                    // v3 approach: query pair contract directly
                    scanType = 'v3';
                    showProgress('Checking v3 pair contract...');
                    const pairCode = await rpcCall('eth_getCode', [pairAddress, 'latest']);
                    if (!pairCode || pairCode === '0x' || pairCode.length <= 4) {
                        showError('v3 pair contract not found on-chain');
                        return;
                    }
                    
                    showProgress('Fetching v3 swap events...');
                    swapLogs = await rpcCall('eth_getLogs', [{
                        fromBlock: '0x1',
                        toBlock: 'latest',
                        address: pairAddress,
                        topics: [V3_SWAP_TOPIC]
                    }]);
                    
                } else if (isV4) {
                    // v4 approach: query PoolManager with pool ID
                    scanType = 'v4';
                    showProgress('Fetching v4 swap events from PoolManager...');
                    
                    // Get current block for recent range
                    const currentBlock = parseInt(await rpcCall('eth_blockNumber', []), 16);
                    const fromBlock = Math.max(0, currentBlock - 5000);
                    
                    swapLogs = await rpcCall('eth_getLogs', [{
                        fromBlock: '0x' + fromBlock.toString(16),
                        toBlock: 'latest',
                        address: V4_POOL_MANAGER,
                        topics: [null, pairAddress] // pool ID in topics[1]
                    }]);
                    
                } else {
                    showError('Unknown pair type - only v3 and v4 Uniswap pairs supported');
                    return;
                }
                
                if (!swapLogs || swapLogs.length === 0) {
                    showError(`No swap events found (${scanType} pair)`);
                    return;
                }
                
                showProgress(`Found ${swapLogs.length} swaps (${scanType}). Tracing buyers...`);
                
                // Get unique TX hashes
                const seenTxs = new Set();
                const txHashes = [];
                for (const log of swapLogs) {
                    const tx = log.transactionHash;
                    if (!seenTxs.has(tx)) {
                        seenTxs.add(tx);
                        txHashes.push({ tx, block: parseInt(log.blockNumber, 16) });
                    }
                }
                
                // Trace TXs to find real buyers (limit to 100)
                const walletMap = new Map();
                const toCheck = txHashes.slice(0, 100);
                
                for (let i = 0; i < toCheck.length; i++) {
                    const { tx, block } = toCheck[i];
                    try {
                        const txData = await rpcCall('eth_getTransactionByHash', [tx]);
                        if (txData && txData.from) {
                            const from = txData.from.toLowerCase();
                            if (!walletMap.has(from)) {
                                walletMap.set(from, { firstBlock: block, txHash: tx, count: 1 });
                            } else {
                                walletMap.get(from).count++;
                            }
                        }
                    } catch (e) { /* skip */ }
                    if (i % 10 === 0) {
                        showProgress(`Tracing buyers... ${i}/${toCheck.length}`);
                    }
                }
                
                showProgress(`Found ${walletMap.size} unique wallets. Checking types...`);
                
                // Check if each wallet is EOA or contract
                const wallets = [];
                let checked = 0;
                for (const [wAddr, data] of walletMap) {
                    try {
                        const code = await rpcCall('eth_getCode', [wAddr, 'latest']);
                        const isContract = code && code !== '0x' && code.length > 4;
                        
                        wallets.push({
                            address: wAddr,
                            type: isContract ? 'contract' : 'buyer',
                            badge: isContract ? 'Contract' : 'Early Buyer',
                            first_block: data.firstBlock,
                            tx_hash: data.txHash,
                            swap_count: data.count
                        });
                    } catch (e) { /* skip */ }
                    checked++;
                    if (checked % 5 === 0) {
                        showProgress(`Checking wallet types... ${checked}/${walletMap.size}`);
                    }
                }
                
                wallets.sort((a, b) => a.first_block - b.first_block);
                
                const buyers = wallets.filter(w => w.type === 'buyer');
                const contracts = wallets.filter(w => w.type === 'contract');
                
                document.getElementById('totalWallets').textContent = wallets.length;
                document.getElementById('realBuyers').textContent = buyers.length;
                document.getElementById('contractsFiltered').textContent = contracts.length;
                document.getElementById('statsSection').style.display = 'grid';
                
                renderWallets(wallets.slice(0, 50));
                
            } catch (err) {
                console.error('Scan error:', err);
                showError(err.message || 'Failed to scan contract');
            } finally {
                setLoading(false);
                document.getElementById('progress').style.display = 'none';
            }
        }
        
        function renderWallets(wallets) {
            const list = document.getElementById('walletList');
            
            if (wallets.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No wallets found</p></div>';
                return;
            }
            
            list.innerHTML = wallets.map((w, i) => {
                const icon = w.type === 'buyer' ? '💎' : '📦';
                const badgeClass = w.type === 'buyer' ? 'badge-buyer' : 'badge-contract';
                
                return `
                    <div class="wallet-card">
                        <div class="wallet-header">
                            <div>
                                <div class="wallet-name">${icon} ${w.badge}</div>
                                <div class="wallet-address">${w.address}</div>
                            </div>
                            <span class="wallet-badge ${badgeClass}">${w.type.toUpperCase()}</span>
                        </div>
                        <div class="wallet-details">
                            <div class="detail-item">
                                <div class="detail-label">First Block</div>
                                <div class="detail-value">#${w.first_block.toLocaleString()}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Swap Count</div>
                                <div class="detail-value">${w.swap_count}</div>
                            </div>
                            <div class="detail-item" style="grid-column: 1 / -1;">
                                <div class="detail-label">First TX</div>
                                <div class="detail-value" style="font-size: 10px; word-break: break-all; font-family: monospace;">${w.tx_hash}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('scanBtn');
            if (loading) {
                btn.disabled = true;
                btn.textContent = 'Scanning...';
                document.getElementById('walletList').innerHTML = '<div class="spinner"></div>';
            } else {
                btn.disabled = false;
                btn.textContent = 'Scan';
            }
        }
        
        function showError(msg) {
            document.getElementById('errorBar').style.display = 'block';
            document.getElementById('errorBar').textContent = msg;
        }
        
        function hideError() {
            document.getElementById('errorBar').style.display = 'none';
        }
        
        document.getElementById('contractInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanContract();
        });
    </script>
</body>
</html>
