<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FnF Radar - Real-time Wallet Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a2e;
            --border: #2a2a3e;
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .input-group { display: flex; gap: 8px; }
        .input-group input {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
        }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .wallet-list { display: flex; flex-direction: column; gap: 10px; }
        .wallet-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
        }
        .wallet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .wallet-name { font-weight: 600; font-size: 14px; }
        .wallet-address { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        .wallet-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-buyer { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-contract { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-burner { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-pool { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
        .wallet-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .detail-item { background: var(--card); border-radius: 10px; padding: 10px; }
        .detail-label { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
        .detail-value { font-size: 13px; font-weight: 600; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); border-radius: 12px; padding: 12px; color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">⚡ FnF Radar</h1>
            <p class="tagline">Robin Hood Chain • Mainnet Scanner</p>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="contractInput" placeholder="Enter token contract address..." />
                <button class="btn" id="scanBtn" onclick="scanContract()">Scan</button>
            </div>
        </div>
        
        <div id="errorBar" class="error-msg"></div>
        
        <div class="stats" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="totalWallets">0</div>
                <div class="stat-label">Scanned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="realBuyers">0</div>
                <div class="stat-label">Real Buyers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="botsFiltered">0</div>
                <div class="stat-label">Filtered</div>
            </div>
        </div>
        
        <div class="wallet-list" id="walletList">
            <div class="empty-state">
                <p>Enter any token contract address on Robin Hood Chain mainnet</p>
            </div>
        </div>
    </div>
    
    <script>
        const RPC_URL = 'https://rpc.mainnet.chain.robinhood.com';
        const TRANSFER_TOPIC = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
        
        async function rpcCall(method, params) {
            const resp = await fetch(RPC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', method, params, id: 1 })
            });
            const data = await resp.json();
            return data.result;
        }
        
        function hexToHex(hex) {
            if (!hex || hex === '0x' || hex === '0x0') return '';
            return hex.slice(2);
        }
        
        function hexToInt(hex) {
            if (!hex || hex === '0x' || hex === '0x0') return 0;
            try {
                const clean = hex.startsWith('0x') ? hex.slice(2) : hex;
                return parseInt(clean, 16) || 0;
            } catch { return 0; }
        }
        
        function formatAmount(value, decimals) {
            if (value === 0) return '0';
            const formatted = value / Math.pow(10, decimals || 18);
            if (formatted >= 1000000) return (formatted / 1000000).toFixed(1) + 'M';
            if (formatted >= 1000) return (formatted / 1000).toFixed(1) + 'K';
            return formatted.toFixed(2);
        }
        
        async function scanContract() {
            const address = document.getElementById('contractInput').value.trim();
            if (!address) { showError('Please enter a contract address'); return; }
            if (!/^0x[a-fA-F0-9]{40}$/i.test(address)) { showError('Invalid Ethereum address'); return; }
            
            hideError();
            setLoading(true);
            
            try {
                const addr = address.toLowerCase();
                
                // Get current block first
                const blockResp = await rpcCall('eth_blockNumber', []);
                const currentBlock = hexToInt(blockResp);
                const deployBlock = Math.max(0, currentBlock - 5000);
                
                // Get token info and logs in parallel
                const [name, symbol, decimals, supply, logs] = await Promise.all([
                    rpcCall('eth_call', [{ to: addr, data: '0x06fdde03' }, 'latest']),
                    rpcCall('eth_call', [{ to: addr, data: '0x95d89b41' }, 'latest']),
                    rpcCall('eth_call', [{ to: addr, data: '0x313ce567' }, 'latest']),
                    rpcCall('eth_call', [{ to: addr, data: '0x18160ddd' }, 'latest']),
                    rpcCall('eth_getLogs', [{
                        fromBlock: '0x' + deployBlock.toString(16),
                        toBlock: '0x' + currentBlock.toString(16),
                        address: addr,
                        topics: [TRANSFER_TOPIC]
                    }])
                ]);
                
                if (!logs || !Array.isArray(logs)) {
                    showError('No transfer data found');
                    return;
                }
                
                const deployBlockNum = hexToInt(blockResp) - 2000;
                const walletMap = new Map();
                
                for (const log of logs) {
                    if (!log.topics || log.topics.length < 3) continue;
                    
                    const toAddr = '0x' + log.topics[2].slice(26);
                    const amount = BigInt(log.data || '0x0');
                    
                    if (!walletMap.has(toAddr)) {
                        walletMap.set(toAddr, { received: 0n, blocks: [], txHashes: new Set(), firstBlock: Infinity });
                    }
                    walletMap.get(toAddr).received += amount;
                    const block = hexToInt(log.blockNumber);
                    walletMap.get(toAddr).blocks.push(block);
                    if (log.transactionHash) walletMap.get(toAddr).txHashes.add(log.transactionHash);
                    walletMap.get(toAddr).firstBlock = Math.min(walletMap.get(toAddr).firstBlock, block);
                }
                
                const wallets = [];
                for (const [wAddr, data] of walletMap) {
                    const codeResp = await rpcCall('eth_getCode', [wAddr, 'latest']);
                    const isContract = codeResp && codeResp !== '0x' && codeResp !== '0x0';
                    
                    let wtype, badge;
                    if (data.received > BigInt(1e12)) {
                        if (isContract) { wtype = 'pool_manager'; badge = 'Pool Manager'; }
                        else { wtype = 'buyer'; badge = 'Early Buyer'; }
                    } else if (isContract) {
                        wtype = 'contract'; badge = 'Contract';
                    } else {
                        wtype = 'buyer'; badge = 'Active Wallet';
                    }
                    
                    wallets.push({
                        address: wAddr,
                        type: wtype,
                        badge: badge,
                        amount: formatAmount(Number(data.received), hexToInt(decimals)),
                        first_buy_block: data.firstBlock === Infinity ? null : data.firstBlock,
                        tx_hash: [...data.txHashes][0],
                        tx_count: data.txHashes.size,
                        eth_balance: 0,
                        burst_score: Math.min(100, Math.max(0, 100 - (data.firstBlock - deployBlockNum)))
                    });
                }
                
                wallets.sort((a, b) => (a.first_buy_block || 0) - (b.first_buy_block || 0));
                displayResults(wallets);
                
            } catch (err) {
                console.error(err);
                showError(err.message || 'Failed to scan contract');
            } finally {
                setLoading(false);
            }
        }
        
        function displayResults(wallets) {
            const buyers = wallets.filter(w => w.type === 'buyer').length;
            const contracts = wallets.filter(w => ['contract', 'pool_manager'].includes(w.type)).length;
            
            document.getElementById('totalWallets').textContent = wallets.length;
            document.getElementById('realBuyers').textContent = buyers;
            document.getElementById('botsFiltered').textContent = contracts;
            document.getElementById('statsSection').style.display = 'grid';
            
            renderWallets(wallets.slice(0, 50));
        }
        
        function renderWallets(wallets) {
            const list = document.getElementById('walletList');
            
            if (wallets.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No wallets found</p></div>';
                return;
            }
            
            list.innerHTML = wallets.map(w => {
                const icon = w.type === 'buyer' ? '💎' : 
                            w.type === 'contract' ? '📦' : 
                            w.type === 'burner' ? '🔥' : '⚙️';
                const badgeClass = w.type === 'buyer' ? 'badge-buyer' : 
                                  w.type === 'burner' ? 'badge-burner' : 
                                  w.type === 'pool_manager' ? 'badge-pool' : 'badge-contract';
                
                return `
                    <div class="wallet-card">
                        <div class="wallet-header">
                            <div>
                                <div class="wallet-name">${icon} ${w.badge}</div>
                                <div class="wallet-address">${w.address}</div>
                            </div>
                            <span class="wallet-badge ${badgeClass}">${w.type.toUpperCase()}</span>
                        </div>
                        <div class="wallet-details">
                            <div class="detail-item">
                                <div class="detail-label">Amount</div>
                                <div class="detail-value">${w.amount}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">First Block</div>
                                <div class="detail-value">#${w.first_buy_block ? w.first_buy_block.toLocaleString() : '—'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">TX Count</div>
                                <div class="detail-value">${w.tx_count}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Burst Score</div>
                                <div class="detail-value">${w.burst_score}/100</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('scanBtn');
            const list = document.getElementById('walletList');
            
            if (loading) {
                btn.disabled = true;
                btn.textContent = 'Scanning...';
                list.innerHTML = '<div class="spinner"></div>';
            } else {
                btn.disabled = false;
                btn.textContent = 'Scan';
            }
        }
        
        function showError(msg) {
            document.getElementById('errorBar').style.display = 'block';
            document.getElementById('errorBar').textContent = msg;
        }
        
        function hideError() {
            document.getElementById('errorBar').style.display = 'none';
        }
        
        document.getElementById('contractInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanContract();
        });
    </script>
</body>
</html>
