<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FnF Radar - Real-time Wallet Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a2e;
            --border: #2a2a3e;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }
        
        /* Search */
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        .input-group input {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus {
            border-color: var(--primary);
        }
        
        .input-group input::placeholder {
            color: var(--text-dim);
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        /* Wallet cards */
        .wallet-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .wallet-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            transition: all 0.2s;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .wallet-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .wallet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .wallet-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .wallet-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .wallet-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .wallet-address {
            font-size: 11px;
            color: var(--text-dim);
            font-family: monospace;
        }
        
        .wallet-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge-buyer { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-contract { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-burner { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-pool { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
        
        .wallet-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .detail-item {
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
        }
        
        .detail-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }
        
        .detail-value {
            font-size: 13px;
            font-weight: 600;
        }
        
        .tx-hash {
            font-family: monospace;
            font-size: 10px;
            color: var(--text-muted);
            word-break: break-all;
        }
        
        /* Empty & Loading */
        .empty-state, .loading {
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .empty-desc { font-size: 13px; color: var(--text-muted); }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Token info banner */
        .token-banner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            display: none;
        }
        
        .token-banner h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .token-banner p {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Error state */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            border-radius: 12px;
            padding: 12px;
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">⚡ FnF Radar</h1>
            <p class="tagline">Robin Hood Chain • Mainnet Scanner</p>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="contractInput" placeholder="Enter token contract address..." />
                <button class="btn" id="scanBtn" onclick="scanContract()">Scan</button>
            </div>
        </div>
        
        <div id="errorBar" class="error-msg"></div>
        
        <div id="tokenBanner" class="token-banner">
            <h3 id="tokenName">Loading...</h3>
            <p id="tokenDetails">Deploy block: ---</p>
        </div>
        
        <div class="stats" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="totalWallets">0</div>
                <div class="stat-label">Scanned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="realBuyers">0</div>
                <div class="stat-label">Real Buyers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="botsFiltered">0</div>
                <div class="stat-label">Filtered</div>
            </div>
        </div>
        
        <div class="filters" id="filters" style="display: none;">
            <div class="chip active" data-filter="all" onclick="filterWallets('all')">All</div>
            <div class="chip" data-filter="buyer" onclick="filterWallets('buyer')">Buyers</div>
            <div class="chip" data-filter="contract" onclick="filterWallets('contract')">Contracts</div>
            <div class="chip" data-filter="burner" onclick="filterWallets('burner')">Burners</div>
        </div>
        
        <div class="wallet-list" id="walletList">
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3 class="empty-title">Ready to Scan</h3>
                <p class="empty-desc">Enter any token contract address on Robin Hood Chain mainnet</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        let currentData = null;
        let currentFilter = 'all';
        
        document.getElementById('contractInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') scanContract();
        });
        
        async function scanContract() {
            const address = document.getElementById('contractInput').value.trim();
            if (!address) {
                showError('Please enter a contract address');
                return;
            }
            
            if (!/^0x[a-fA-F0-9]{40}$/.test(address)) {
                showError('Invalid Ethereum address format');
                return;
            }
            
            hideError();
            setLoading(true);
            
            try {
                const response = await fetch(`${API_URL}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, block_range: 5000 })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Scan failed');
                }
                
                const data = await response.json();
                currentData = data;
                displayResults(data);
                
            } catch (err) {
                showError(err.message || 'Failed to scan contract');
                console.error(err);
            } finally {
                setLoading(false);
            }
        }
        
        function displayResults(data) {
            // Token banner
            document.getElementById('tokenBanner').style.display = 'block';
            document.getElementById('tokenName').textContent = `${data.token.name} (${data.token.symbol})`;
            document.getElementById('tokenDetails').textContent = 
                `Deployed: Block ${data.token.deploy_block.toLocaleString()} • Supply: ${data.token.supply.toLocaleString()} • Transfers: ${data.token.total_transfers}`;
            
            // Stats
            document.getElementById('totalWallets').textContent = data.stats.total_wallets;
            document.getElementById('realBuyers').textContent = data.stats.real_buyers;
            document.getElementById('botsFiltered').textContent = data.stats.contracts_filtered + data.stats.burners_filtered;
            document.getElementById('statsSection').style.display = 'grid';
            document.getElementById('filters').style.display = 'flex';
            
            // Wallet list
            renderWallets(data.wallets);
        }
        
        function renderWallets(wallets) {
            const filtered = currentFilter === 'all' 
                ? wallets 
                : wallets.filter(w => w.type === currentFilter);
            
            const list = document.getElementById('walletList');
            
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎯</div>
                        <h3 class="empty-title">No Results</h3>
                        <p class="empty-desc">No wallets match this filter</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = filtered.map((w, i) => {
                const icon = w.type === 'buyer' ? '💎' : 
                            w.type === 'contract' ? '📦' : 
                            w.type === 'burner' ? '🔥' : '⚙️';
                const badgeClass = w.type === 'buyer' ? 'badge-buyer' : 
                                  w.type === 'burner' ? 'badge-burner' : 
                                  w.type === 'pool_manager' ? 'badge-pool' : 'badge-contract';
                
                return `
                    <div class="wallet-card" style="animation-delay: ${i * 0.05}s">
                        <div class="wallet-header">
                            <div class="wallet-info">
                                <div class="wallet-avatar">${icon}</div>
                                <div>
                                    <div class="wallet-name">${w.badge}</div>
                                    <div class="wallet-address">${w.address}</div>
                                </div>
                            </div>
                            <span class="wallet-badge ${badgeClass}">${w.badge}</span>
                        </div>
                        <div class="wallet-details">
                            <div class="detail-item">
                                <div class="detail-label">Amount Received</div>
                                <div class="detail-value">${w.amount}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">First Seen</div>
                                <div class="detail-value">${w.first_buy_block ? '#' + w.first_buy_block.toLocaleString() : '—'}</div>
                            </div>
                            ${w.tx_hash ? `
                            <div class="detail-item" style="grid-column: 1 / -1">
                                <div class="detail-label">First TX Hash</div>
                                <div class="tx-hash">${w.tx_hash}</div>
                            </div>
                            ` : ''}
                            <div class="detail-item">
                                <div class="detail-label">Total TXs</div>
                                <div class="detail-value">${w.tx_count}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">ETH Balance</div>
                                <div class="detail-value">${w.eth_balance.toFixed(4)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function filterWallets(filter) {
            currentFilter = filter;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            document.querySelector(`.chip[data-filter="${filter}"]`).classList.add('active');
            if (currentData) {
                renderWallets(currentData.wallets);
            }
        }
        
        function setLoading(loading) {
            const btn = document.getElementById('scanBtn');
            const list = document.getElementById('walletList');
            
            if (loading) {
                btn.disabled = true;
                btn.textContent = 'Scanning...';
                list.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p class="empty-desc">Querying blockchain for early buyers...</p>
                    </div>
                `;
            } else {
                btn.disabled = false;
                btn.textContent = 'Scan';
            }
        }
        
        function showError(msg) {
            const bar = document.getElementById('errorBar');
            bar.textContent = msg;
            bar.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorBar').style.display = 'none';
        }
    </script>
</body>
</html>
